{{paste the full text or describe the photo}}

Explain it to me like I'm smart but busy:
1. One-sentence summary
2. Do I owe, do I need to act, and by when?
3. 3 key details that actually matter
4. If I need to reply, draft 2 sentences I can send

No jargon. Flag anything that looks like a scam.`,saves:"12 min"},{id:2,category:"Everyday Life",title:"Meal plan from what's in my fridge",when:"When you're staring at random ingredients.",template:`What's in my fridge / pantry:
{{list ingredients, include approximate amounts}}

Constraints: {{diet, time you have, who you're cooking for}}

Give me:
1. 3 meals I can make with ONLY this + salt/pepper/oil
2. For each: 4 steps max, time, and one swap if I'm missing something
3. What to buy next to make this go further

No fancy ingredients.`,saves:"18 min"},{id:3,category:"Everyday Life",title:"Polite but firm cancel / say no",when:"When you need to bail without burning bridges.",template:`I need to say no / cancel this:
{{describe the situation + who it's to + why you want out}}

Tone I want: {{friendly / professional / very firm}}
Write 2 options:
1. Short text (under 30 words)
2. Slightly longer email with a clear alternative if possible

No apologies spiral. No over-explaining.`,saves:"8 min"},{id:4,category:"Everyday Life",title:"Script a difficult conversation",when:"Before you talk to family, partner, landlord, boss.",template:`Context for a tough talk:
{{who, what happened, what outcome you want}}

What I tend to say wrong: {{your bad habit, e.g., people-please / get defensive}}

Give me:
1. 30-sec opener I can actually say
2. 3 points to make, in order
3. 2 phrases for if they get defensive
4. How to close it in under 2 minutes

Keep it calm, adult, and usable today.`,saves:"15 min"},{id:5,category:"Everyday Life",title:"Turn a wishlist into a real travel plan",when:"When you have 20 tabs and zero itinerary.",template:`Trip idea:
{{where, when, who, budget, 3-10 things you pinned}}

Constraints: {{energy level, must-avoid, pace you want}}

Make me a plan:
Day-by-day in table, 2-3 things per day max, with morning/afternoon/evening
One backup for bad weather per day
One food spot per day that locals actually go to
No tourist traps.

End with packing checklist (10 items max).`,saves:"25 min"},{id:6,category:"Everyday Life",title:"DIY or call a pro? Triage this home issue",when:"For leaks, noises, errors, and weird smells.",template:`Problem at home:
{{describe what you see/hear, when it started, photos if you have them}}

Tell me:
1. What it probably is (2 most likely causes)
2. Can I safely DIY it? Yes/No/Maybe
3. If yes: 5 steps, tools needed, how long
4. If no: exactly what to tell a pro + 2 questions to avoid getting overcharged
5. How urgent is it: today / this week / monitor

Safety first.`,saves:"20 min"},{id:7,category:"Work Smarter",title:"Turn messy notes into an action plan + email",when:"Right after a meeting when your notes are chaos.",template:`Messy meeting notes:
{{paste raw notes, transcript, or voice memo summary}}

Goal of meeting was: {{what were you trying to decide}}

Do this:
1. 5-bullet summary of what was actually decided
2. Task list table: Task | Owner | Due | Status
3. Draft follow-up email (under 120 words) that confirms next steps
4. List what was NOT decided but needs to be

Make it skimmable.`,saves:"15 min"},{id:8,category:"Work Smarter",title:"Make your resume bullet sound human",when:"When your experience sounds like AI filler.",template:`Boring resume bullet / job post:
{{paste original}}

My real work was: {{what you actually did, tools, numbers}}
Audience: {{hiring manager / recruiter / LinkedIn}}

Rewrite 3 versions:
1. Results-first (start with number)
2. Plain English (no buzzwords)
3. Story version (one sentence of context)

Keep each under 25 words. No "leveraged synergy".`,saves:"10 min"},{id:9,category:"Work Smarter",title:"Explain this spreadsheet like I'm 5",when:"When numbers make your eyes glaze over.",template:`Data to explain:
{{paste table, chart description, or sheet summary}}

Context: {{what is this for, who will read it}}

Give me:
1. In one sentence, what's happening?
2. 3 insights a non-analyst would miss
3. 1 chart I should make to show this clearly
4. What decision should we make based on this?

No jargon. If you're guessing, say so.`,saves:"14 min"},{id:10,category:"Work Smarter",title:"Turn a ramble into a crisp Slack update",when:"Before you drop a 6-paragraph message in #general.",template:`My messy draft:
{{paste your long version}}

Audience: {{team, leadership, cross-functional}}
Goal: {{inform / ask for decision / unblock}}

Rewrite as:
TL;DR: 1 line
Context: 2 bullets
What I need: explicit ask + deadline
Optional thread: details

Total under 80 words in main message.`,saves:"6 min"},{id:11,category:"Work Smarter",title:"Prioritize my todo list ruthlessly",when:"When everything feels urgent.",template:`My todo list:
{{paste everything on your mind, messy is fine}}

My constraints today: {{time you have, energy, top 1 goal}}

Sort into:
\uD83D\uDD25 Must today (max 3)
→ Should this week (max 5)
\uD83D\uDCA4 Park or delete (with why)

For each \uD83D\uDD25: first 15-min step.
End with one sentence: what will you have to say no to today?`,saves:"11 min"},{id:12,category:"Work Smarter",title:"Follow-up email that actually gets a reply",when:"After being ghosted, but you still need an answer.",template:`Original email/thread:
{{paste}}

Why they haven't replied maybe: {{your guess}}
What I need from them: {{specific decision/info}}

Write 2 options:
1. Bump (under 45 words, friendly + new info)
2. Closing-the-loop (gives them an easy out but creates urgency)

Subject lines: 3 options, under 6 words each.
No guilt-tripping.`,saves:"9 min"},{id:13,category:"Build & Code",title:"Debug this error without rewriting everything",when:"When you're stuck and Stack Overflow is too noisy.",template:`Error + context:
{{paste full error, stack trace, relevant code (20-80 lines)}}

What I already tried: {{list}}
Stack: {{language, framework, versions}}

I want:
1. Most likely cause in 1 sentence
2. 3 things to check in order (fastest first)
3. Minimal fix (diff style) - don't rewrite my file
4. How to prevent this next time

No generic advice.`,saves:"22 min"},{id:14,category:"Build & Code",title:"Turn a messy idea into a buildable spec",when:"When you have vibes but need a PRD.",template:`My messy idea:
{{describe the idea as you'd tell a friend}}

Who it's for: {{user}}
What must work on day 1: {{core job}}
What can wait: {{nice-to-have}}

Output a spec with:
1. Problem + user + outcome (3 lines)
2. User stories (3-5, Given/When/Then)
3. Non-goals
4. Data model (entities + fields)
5. API/events (3-5 endpoints)
6. Edge cases + open questions

Keep it shippable in < 2 days.`,saves:"30 min"},{id:15,category:"Build & Code",title:"Brutal code review — what would you change?",when:"Before you merge and regret it.",template:`Code to review:
{{paste file or function, up to 150 lines}}

Context: {{what it's supposed to do, performance constraints}}

Review like a senior engineer who wants me to grow:
1. Bugs / race conditions / security holes
2. Readability: 3 renames or extractions
3. Simpler approach if this is over-engineered
4. Final verdict: Ship / Ship with nits / Needs rework - why

Be blunt but helpful. Show code suggestions as diffs.`,saves:"18 min"},{id:16,category:"Build & Code",title:"Generate edge-case tests from this function",when:"When you need tests that actually catch bugs.",template:`Function to test:
{{paste function + its types}}

Stack: {{Jest / Vitest / pytest / etc}}
